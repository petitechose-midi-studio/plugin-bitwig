; PlatformIO Project Configuration File - Bitwig Plugin
;
; This plugin firmware consumes the narrow device-support package from the
; Core repository. The full Core dependency below is ignored and retained only
; as the one-lot rollback rail documented by L-R15-04.

[platformio]
default_envs = dev
extra_configs = ../core/oc-sdk.ini

; ============================================================================
; Common settings shared by all environments
; ============================================================================
[env]
framework = arduino
platform = teensy
board = teensy41
board_build.f_cpu = 450000000L
monitor_dtr = 0
monitor_rts = 0

; Auto stop/restart OC Bridge service during upload
extra_scripts = post:../core/script/pio/oc_service.py

; L-R15-04 keeps the old full dependency as an inert one-lot rollback rail.
; It is removed with this ignore rule in L-R15-05B.
lib_ignore = ms-core

build_flags =
	-D USB_MIDI_SERIAL
	-D TEENSY_OPT_SMALLEST_CODE
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE

; ============================================================================
; Development: uses local repos via symlink (requires repos in ../)
; Usage: pio run -e dev
; ============================================================================
[env:dev]
build_flags =
	${env.build_flags}
	-D OC_LOG
	; -D PERF_MON ; CPU/FPS monitor
	; -D MEM_MON  ; Memory monitor
lib_deps =
	ms-ui=symlink://../ui
	ms-device-support=symlink://../core/device-support
	ms-core=symlink://../core
	oc-note=symlink://../../open-control/note
	oc-ui-lvgl-components=symlink://../../open-control/ui-lvgl-components
	oc-ui-lvgl=symlink://../../open-control/ui-lvgl
	oc-hal-teensy=symlink://../../open-control/hal-teensy
	oc-hal-common=symlink://../../open-control/hal-common
	oc-framework=symlink://../../open-control/framework

; =========================================================================
; Release: pinned GitHub dependencies (requires core+ui checkout in ../)
; Usage: pio run -e release
; =========================================================================
[env:release]
build_flags =
	${env.build_flags}
	-D OC_LOG
lib_deps =
	ms-ui=symlink://../ui
	ms-device-support=symlink://../core/device-support
	ms-core=symlink://../core
	${oc_sdk_deps.lib_deps}
